<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Redaman Splitter</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .tabs {
      display: flex;
      margin-bottom: 15px;
    }
    .tab-button {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      background: #f0f0f0;
      border: none;
      border-bottom: 3px solid transparent;
      font-weight: bold;
    }
    .tab-button.active {
      border-bottom: 3px solid #007BFF;
      background: #e6f0ff;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .hitung {
      background: #007BFF;
      color: white;
    }
    .reset {
      background: #dc3545;
      color: white;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      color: #333;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kalkulator Redaman Splitter</h2>
    <div class="tabs">
      <button class="tab-button active" onclick="switchTab(event, 'outputTab')">Hitung Redaman Output</button>
      <button class="tab-button" onclick="switchTab(event, 'inputTab')">Hitung Redaman Input</button>
    </div>

    <div id="outputTab" class="tab-content active">
      <label for="splitterOutput">Tipe Splitter:</label>
      <select id="splitterOutput">
        <option value="2">1:2</option>
        <option value="4">1:4</option>
        <option value="8" selected>1:8</option>
        <option value="16">1:16</option>
      </select>
      <label for="inputLoss">Redaman Input (dBm):</label>
      <input type="text" id="inputLoss" placeholder="Contoh: +5">
      <button class="hitung" onclick="hitungOutput()">Hitung Redaman Output</button>
      <button class="reset" onclick="resetForm()">Reset</button>
    </div>

    <div id="inputTab" class="tab-content">
      <label for="splitterInput">Tipe Splitter:</label>
      <select id="splitterInput">
        <option value="2">1:2</option>
        <option value="4">1:4</option>
        <option value="8" selected>1:8</option>
        <option value="16">1:16</option>
      </select>
      <label for="outputLoss">Redaman Output (dBm):</label>
      <input type="text" id="outputLoss" placeholder="Contoh: -6.5">
      <button class="hitung" onclick="hitungInput()">Hitung Redaman Input</button>
      <button class="reset" onclick="resetForm()">Reset</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const splitterLosses = {
      2: 3.6,
      4: 6.8,
      8: 10.35,
      16: 13.5
    };

    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      document.getElementById('result').innerHTML = '';
    }

    function hitungOutput() {
      const n = parseInt(document.getElementById('splitterOutput').value);
      const idealLoss = splitterLosses[n];

      let inputRaw = document.getElementById('inputLoss').value.trim();
      if (inputRaw.startsWith('+')) inputRaw = inputRaw.substring(1);
      const input = parseFloat(inputRaw);

      if (isNaN(input)) {
        document.getElementById('result').innerHTML = "⚠️ Masukkan nilai input yang valid.";
        return;
      }

      const output = input - idealLoss;

      document.getElementById('result').innerHTML = `
        🔻 <strong>Redaman Input:</strong> ${input.toFixed(2)} dBm<br>
        🔻 <strong>Redaman Ideal Splitter:</strong> -${idealLoss.toFixed(2)} dB<br>
        🔻 <strong>Perkiraan Redaman Output:</strong> ${output.toFixed(2)} dBm
      `;
    }

    function hitungInput() {
      const n = parseInt(document.getElementById('splitterInput').value);
      const idealLoss = splitterLosses[n];

      let outputRaw = document.getElementById('outputLoss').value.trim();
      if (outputRaw.startsWith('+')) outputRaw = outputRaw.substring(1);
      const output = parseFloat(outputRaw);

      if (isNaN(output)) {
        document.getElementById('result').innerHTML = "⚠️ Masukkan nilai output yang valid.";
        return;
      }

      const input = output + idealLoss;

      document.getElementById('result').innerHTML = `
        🔻 <strong>Redaman Output:</strong> ${output.toFixed(2)} dBm<br>
        🔻 <strong>Redaman Ideal Splitter:</strong> -${idealLoss.toFixed(2)} dB<br>
        🔻 <strong>Perkiraan Redaman Input:</strong> ${input.toFixed(2)} dBm
      `;
    }

    function resetForm() {
      document.getElementById('inputLoss').value = "";
      document.getElementById('outputLoss').value = "";
      document.getElementById('result').innerHTML = "";
    }
  </script>
</body>
</html>
